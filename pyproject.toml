[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipretrain-core"
version = "0.4.4"
description = "Vision-language pretrain stack: ingest, FSDP, robustness, compression."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Pavanam Thomas", email = "thomaspavanam@gmail.com" }]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "aiohttp>=3.9",
    "bitsandbytes>=0.43; platform_system != 'Darwin' or platform_machine != 'arm64'",
    "wandb>=0.16",
    "prometheus_client>=0.20",
    "numpy>=1.24",
    "Pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
omni-stream = "data.async_streamer:main"
omni-curriculum = "data.curriculum:main"
omni-bucket = "data.bucketing:main"
omni-train = "training.distributed:main"
omni-ckpt = "training.checkpoints:main"
omni-telem = "training.telemetry:main"
omni-attack = "robustness.attack_engine:main"
omni-calibrate = "robustness.calibration:main"
omni-quantize = "optimization.quantizer:main"
omni-bench = "optimization.benchmarker:main"

[tool.setuptools.packages.find]
include = ["data*", "training*", "robustness*", "optimization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
