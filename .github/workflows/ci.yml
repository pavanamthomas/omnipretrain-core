name: ci

on:
  push:
  pull_request:

# CPU-only. The CUDA torch wheel OOM'd the 14GB runner the first time this
# job existed; keep the cpu index explicit.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers aiohttp wandb prometheus_client numpy Pillow tqdm pytest pytest-asyncio
          pip install bitsandbytes || echo "bnb wheel missing; fallback path is what we test"
      - name: pytest
        env:
          WANDB_MODE: disabled
          TOKENIZERS_PARALLELISM: "false"
        run: python -m pytest -q --tb=short
